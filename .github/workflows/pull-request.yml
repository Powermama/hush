name: Pull request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the squash-commit title
        run: |
          python3 - <<'PY'
          import json, os, re
          with open(os.environ['GITHUB_EVENT_PATH']) as event:
              title = json.load(event)['pull_request']['title']
          pattern = r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .+$'
          if not re.fullmatch(pattern, title):
              raise SystemExit('Use a Conventional Commit title, e.g. fix(hud): restore the listening panel')
          PY
