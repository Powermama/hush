#
# The website's checks: type checking, server tests and the production build,
# every browser journey in three shards, the blog journeys and the zero-downtime
# deployment. A reusable workflow: ci.yml calls it when the selection
# (.github/scripts/ci_scope.py) finds the component affected; a change to this
# file affects only this component.
name: Website

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp/apps/web
    # Server contracts that production runs on PostgreSQL are tested against it,
    # not only against the SQLite stand-in.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hush_test
          POSTGRES_USER: hush
          POSTGRES_PASSWORD: hush-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hush -d hush_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HUSH_TEST_DATABASE_URL: postgresql://hush:hush-test@127.0.0.1:5432/hush_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - name: Migrate the test database
        run: DATABASE_URL="$HUSH_TEST_DATABASE_URL" bun run db:migrate
      - name: Check dependency advisories
        # GHSA-fc5q-39xc-vjpf (picomatch ReDoS, every version through 4.0.7, no fix released):
        # picomatch is reached only through build tools (Vite, Orval, Paraglide) that match
        # glob patterns from our own configuration, never input from users. Remove the
        # exception once a fixed picomatch is published and the lockfile is updated.
        run: bun audit --ignore=GHSA-fc5q-39xc-vjpf
      # The site catalogue imports the generated blog list; nothing generated is committed.
      - name: Generate the blog
        run: bun run blog:generate
      - run: bun test server scripts/prerender scripts/blog
      - run: bun run api:check
      - run: bun run build
      # The build type-checks the app; the browser journeys need their own pass.
      - name: Type-check the browser journeys
        run: bun run lint:tests
      - name: Verify the production image includes the prerender modules
        run: docker build --target build --tag hush-web-build-check --file Dockerfile ../..

  web-journeys:
    # Every browser journey runs on every web change, split across machines with
    # Playwright sharding (https://playwright.dev/docs/test-sharding). Each shard
    # keeps one worker, so software-rendered WebGL never contends.
    name: Web journeys (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: webapp/apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Restore the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('webapp/bun.lock') }}
      # A package mirror can stall for many minutes. apt retries a stalled download itself;
      # killing the installer from outside would leave apt holding its lock.
      - name: Let apt retry stalled downloads
        run: printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
      - name: Install the browsers and their system packages
        run: bunx playwright install --with-deps chromium webkit
      - run: bunx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures-${{ matrix.shard }}
          path: webapp/apps/web/test-results/
          retention-days: 7

  web-blog:
    # Blog journeys need articles: build with the fixture content.
    name: Blog journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp/apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      # Covers are rendered with Chromium, so the browsers come first.
      - name: Restore the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('webapp/bun.lock') }}
      # A package mirror can stall for many minutes. apt retries a stalled download itself;
      # killing the installer from outside would leave apt holding its lock.
      - name: Let apt retry stalled downloads
        run: printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
      - name: Install the browsers and their system packages
        run: bunx playwright install --with-deps chromium webkit
      - run: HUSH_BLOG_CONTENT_DIR=scripts/blog/fixtures/content bun run build
      - run: bunx playwright test tests/blog.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures-blog
          path: webapp/apps/web/test-results/
          retention-days: 7

  deployment:
    name: Zero-downtime deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: webapp/apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      # Builds the production image and replays Coolify's rolling update under
      # load behind Traefik and a separate PostgreSQL. Fails on any dropped request.
      - name: Replace the web service under continuous load
        run: bun scripts/rolling-update-e2e.ts
