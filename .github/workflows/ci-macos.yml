#
# The Mac checks: the proof package's Swift tests, Swift against the local proof
# service, and the unsigned native Release build. A reusable workflow: ci.yml
# calls it when the selection (.github/scripts/ci_scope.py) finds the component
# affected; a change to this file affects only this component.
name: Native

on:
  workflow_call:
    inputs:
      native:
        description: Also compile the native Release configuration (native code changed, not only the service it talks to).
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  macos:
    name: Native build and proof integration
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Confirm the native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test the proof package
        run: swift test --package-path macos/Packages/HushProvenance --force-resolved-versions
      - name: Install the service dependencies
        working-directory: webapp/apps/web
        run: bun install --frozen-lockfile
      # The service imports the generated blog catalogue, which is not committed.
      - name: Generate the blog
        working-directory: webapp/apps/web
        run: bun run blog:generate
      - name: Test Swift against the local service
        run: |
          cd webapp/apps/web
          NODE_ENV=test PORT=4300 HUSH_PUBLIC_BASE_URL=http://127.0.0.1:4300 bun server/index.ts > "$RUNNER_TEMP/hush-service.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4300/health/ready > /dev/null; then ready=1; break; fi
            kill -0 "$service_pid" || break
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/hush-service.log"; exit 1; fi
          cd ../../..
          HUSH_PROVENANCE_E2E_BASE_URL=http://127.0.0.1:4300 swift test --package-path macos/Packages/HushProvenance --force-resolved-versions --filter enrollsAndPublishesWithHonoService
      - name: Compile the native Release configuration
        if: inputs.native
        working-directory: macos
        run: >-
          xcodebuild -project Hush/Hush.xcodeproj -scheme Hush
          -configuration Release -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/hush-derived-data"
          -onlyUsePackageVersionsFromResolvedFile
          -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO build
