name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected components
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      web: ${{ steps.scope.outputs.web }}
      cms: ${{ steps.scope.outputs.cms }}
      native: ${{ steps.scope.outputs.native }}
      integration: ${{ steps.scope.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Complete PR merge-base / multi-commit push diff, without API file limits.
          fetch-depth: 0
      - name: Test component selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - id: scope
        name: Select checks
        run: python3 .github/scripts/ci_scope.py

  web:
    name: Website
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/ci-web.yml

  cms:
    name: CMS
    needs: changes
    if: needs.changes.outputs.cms == 'true'
    uses: ./.github/workflows/ci-cms.yml

  macos:
    name: Native
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.integration == 'true'
    uses: ./.github/workflows/ci-macos.yml
    with:
      native: ${{ needs.changes.outputs.native == 'true' }}

  result:
    name: CI result
    needs: [changes, web, cms, macos]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all selected checks to pass
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          WEB_REQUIRED: ${{ needs.changes.outputs.web }}
          CMS_REQUIRED: ${{ needs.changes.outputs.cms }}
          NATIVE_REQUIRED: ${{ needs.changes.outputs.native }}
          INTEGRATION_REQUIRED: ${{ needs.changes.outputs.integration }}
          WEB_RESULT: ${{ needs.web.result }}
          CMS_RESULT: ${{ needs.cms.result }}
          NATIVE_RESULT: ${{ needs.macos.result }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ['SCOPE_RESULT'] != 'success':
              raise SystemExit('Component selection failed or was cancelled.')
          if any(os.environ[key] not in {'true', 'false'} for key in ('WEB_REQUIRED', 'CMS_REQUIRED', 'NATIVE_REQUIRED', 'INTEGRATION_REQUIRED')):
              raise SystemExit('Missing or invalid component selection outputs.')
          expected = {
              'WEB_RESULT': os.environ['WEB_REQUIRED'] == 'true',
              'CMS_RESULT': os.environ['CMS_REQUIRED'] == 'true',
              'NATIVE_RESULT': any(os.environ[key] == 'true' for key in ('NATIVE_REQUIRED', 'INTEGRATION_REQUIRED')),
          }
          for key, required in expected.items():
              allowed = {'success'} if required else {'skipped'}
              if os.environ[key] not in allowed:
                  raise SystemExit(f'{key}: {os.environ[key]} did not satisfy the selected checks.')
          print('All selected checks passed.')
          PY
