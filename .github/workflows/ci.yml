name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected components
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      web: ${{ steps.scope.outputs.web }}
      native: ${{ steps.scope.outputs.native }}
      integration: ${{ steps.scope.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Complete PR merge-base / multi-commit push diff, without API file limits.
          fetch-depth: 0
      - name: Test component selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - id: scope
        name: Select checks
        run: python3 .github/scripts/ci_scope.py

  web:
    name: Web journeys
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp
    # Server contracts that production runs on PostgreSQL are tested against it,
    # not only against the SQLite stand-in.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hush_test
          POSTGRES_USER: hush
          POSTGRES_PASSWORD: hush-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hush -d hush_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HUSH_TEST_DATABASE_URL: postgresql://hush:hush-test@127.0.0.1:5432/hush_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - name: Migrate the test database
        run: DATABASE_URL="$HUSH_TEST_DATABASE_URL" bun run db:migrate
      - name: Check dependency advisories
        run: bun audit
      - name: Check committed blog output
        run: bun run blog:check
      - run: bun test server scripts/prerender scripts/blog
      - run: bun run api:check
      - run: bun run build
      - name: Verify the production image includes the prerender modules
        run: docker build --target build --tag hush-web-build-check .
      - run: bunx playwright install --with-deps chromium webkit
      - run: bunx playwright test
      # Blog journeys need articles; build once more with the fixture content.
      # The committed output is untouched outside this job's workspace.
      - name: Blog journeys with fixture articles
        run: |
          HUSH_BLOG_CONTENT_DIR=scripts/blog/fixtures/content bun run blog:generate
          bun run build
          bunx playwright test tests/blog.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: webapp/test-results/
          retention-days: 7

  deployment:
    name: Zero-downtime deployment
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      # Builds the production image and replays Coolify's rolling update under
      # load behind Traefik and a separate PostgreSQL. Fails on any dropped request.
      - name: Replace the web service under continuous load
        run: bun scripts/rolling-update-e2e.ts

  macos:
    name: Native build and proof integration
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.integration == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Confirm the native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test the proof package
        run: swift test --package-path macos/Packages/HushProvenance --force-resolved-versions
      - name: Install the service dependencies
        working-directory: webapp
        run: bun install --frozen-lockfile
      - name: Test Swift against the local service
        run: |
          cd webapp
          NODE_ENV=test PORT=4300 HUSH_PUBLIC_BASE_URL=http://127.0.0.1:4300 bun server/index.ts > "$RUNNER_TEMP/hush-service.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4300/health/ready > /dev/null; then ready=1; break; fi
            kill -0 "$service_pid" || break
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/hush-service.log"; exit 1; fi
          cd ..
          HUSH_PROVENANCE_E2E_BASE_URL=http://127.0.0.1:4300 swift test --package-path macos/Packages/HushProvenance --force-resolved-versions --filter enrollsAndPublishesWithHonoService
      - name: Compile the native Release configuration
        if: needs.changes.outputs.native == 'true'
        working-directory: macos
        run: >-
          xcodebuild -project Hush/Hush.xcodeproj -scheme Hush
          -configuration Release -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/hush-derived-data"
          -onlyUsePackageVersionsFromResolvedFile
          -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO build

  result:
    name: CI result
    needs: [changes, web, deployment, macos]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all selected checks to pass
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          WEB_REQUIRED: ${{ needs.changes.outputs.web }}
          NATIVE_REQUIRED: ${{ needs.changes.outputs.native }}
          INTEGRATION_REQUIRED: ${{ needs.changes.outputs.integration }}
          WEB_RESULT: ${{ needs.web.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          NATIVE_RESULT: ${{ needs.macos.result }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ['SCOPE_RESULT'] != 'success':
              raise SystemExit('Component selection failed or was cancelled.')
          if any(os.environ[key] not in {'true', 'false'} for key in ('WEB_REQUIRED', 'NATIVE_REQUIRED', 'INTEGRATION_REQUIRED')):
              raise SystemExit('Missing or invalid component selection outputs.')
          expected = {
              'WEB_RESULT': os.environ['WEB_REQUIRED'] == 'true',
              'DEPLOYMENT_RESULT': os.environ['WEB_REQUIRED'] == 'true',
              'NATIVE_RESULT': any(os.environ[key] == 'true' for key in ('NATIVE_REQUIRED', 'INTEGRATION_REQUIRED')),
          }
          for key, required in expected.items():
              allowed = {'success'} if required else {'skipped'}
              if os.environ[key] not in allowed:
                  raise SystemExit(f'{key}: {os.environ[key]} did not satisfy the selected checks.')
          print('All selected checks passed.')
          PY
