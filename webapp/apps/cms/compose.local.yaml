# Local development on top of compose.yaml: a fixed database password, images
# and backups on volumes instead of R2, and the API on a host port.
x-cms-local: &cms-local
  NODE_ENV: development
  SERVICE_PASSWORD_64_CMSPOSTGRES: cms-local
  CMS_DATABASE_URL: postgresql://cms:cms-local@cms-postgres:5432/cms
  CMS_S3_BUCKET: ""
  CMS_BACKUP_S3_BUCKET: ""
  CMS_MEDIA_DIR: /app/data/media
  CMS_BACKUP_DIR: /app/data/backups

services:
  cms:
    environment:
      <<: *cms-local
      PORT: "3100"
    ports:
      - "${HUSH_CMS_COMPOSE_PORT:-3100}:3100"
    volumes:
      - hush_local_cms_media:/app/data/media
      - hush_local_cms_backups:/app/data/backups

  cms-scheduler:
    environment:
      <<: *cms-local
    volumes:
      - hush_local_cms_media:/app/data/media
      - hush_local_cms_backups:/app/data/backups

  cms-postgres:
    environment:
      POSTGRES_PASSWORD: cms-local

volumes:
  hush_local_cms_media:
  hush_local_cms_backups:
