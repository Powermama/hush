# Coolify's part of compose.yaml: PostgreSQL alone, as a Docker Compose
# resource that keeps the database's volume. The API and the scheduler run as
# Coolify Dockerfile applications beside it, because Coolify replaces only
# applications with a rolling update and stops every service of a Compose
# resource on each deploy (docs/operations/coolify.md); alone, PostgreSQL is
# redeployed only when this file changes. Its settings are those of
# compose.yaml (tests/compose.test.ts keeps them in step); other platforms run
# compose.yaml itself or map it (docs/reference/deploy-anywhere.md).
services:
  cms-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_CMSPOSTGRES:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hush_cms_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  hush_cms_postgres:
