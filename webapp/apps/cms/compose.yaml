# The hush CMS stack in one file: the API, its scheduler (publishing due posts
# and daily backups) and its own PostgreSQL. Any Docker Compose host runs it
# with `docker compose up`; docs/reference/deploy-anywhere.md maps it to other
# platforms. Each service stands alone: both the API and the scheduler apply
# migrations at start, under one lock. The API publishes no host port, so a
# platform can replace it with a rolling update; a proxy routes to port 3100.
# compose.local.yaml adds what local development needs, and webapp/compose.yaml
# includes both. Secrets are references: their values live in the platform's
# secret store. Empty defaults keep local runs quiet; in production the CMS
# refuses to start when a bucket lacks its keys, and PostgreSQL refuses an
# empty password.
x-cms-environment: &cms-environment
  NODE_ENV: ${NODE_ENV:-production}
  CMS_DATABASE_URL: postgresql://cms:${SERVICE_PASSWORD_64_CMSPOSTGRES:-}@cms-postgres:5432/cms
  CMS_S3_BUCKET: ${CMS_S3_BUCKET:-hush-blog-media}
  CMS_S3_ENDPOINT: ${CMS_S3_ENDPOINT:-}
  CMS_S3_ACCESS_KEY_ID: ${CMS_S3_ACCESS_KEY_ID:-}
  CMS_S3_SECRET_ACCESS_KEY: ${CMS_S3_SECRET_ACCESS_KEY:-}
  CMS_BACKUP_S3_BUCKET: ${CMS_BACKUP_S3_BUCKET:-hush-cms-backups}
  CMS_BACKUP_S3_ENDPOINT: ${CMS_BACKUP_S3_ENDPOINT:-}
  CMS_BACKUP_S3_ACCESS_KEY_ID: ${CMS_BACKUP_S3_ACCESS_KEY_ID:-}
  CMS_BACKUP_S3_SECRET_ACCESS_KEY: ${CMS_BACKUP_S3_SECRET_ACCESS_KEY:-}
  CMS_BACKUP_KEEP_DAYS: ${CMS_BACKUP_KEEP_DAYS:-30}
  CMS_SITE_URL: ${CMS_SITE_URL:-}
  CMS_COOLIFY_URL: ${CMS_COOLIFY_URL:-}
  CMS_COOLIFY_TOKEN: ${CMS_COOLIFY_TOKEN:-}
  CMS_COOLIFY_WEBSITE_UUID: ${CMS_COOLIFY_WEBSITE_UUID:-}
  CMS_INDEXNOW_KEY: ${CMS_INDEXNOW_KEY:-}
  CMS_PUBLIC_URL: ${CMS_PUBLIC_URL:-}
  CMS_ADMIN_GITHUB_IDS: ${CMS_ADMIN_GITHUB_IDS:-}
  CMS_GITHUB_CLIENT_ID: ${CMS_GITHUB_CLIENT_ID:-}
  CMS_GITHUB_CLIENT_SECRET: ${CMS_GITHUB_CLIENT_SECRET:-}

services:
  cms:
    build:
      context: ../..
      dockerfile: apps/cms/Dockerfile
    environment:
      <<: *cms-environment
      PORT: "3100"
    expose:
      - "3100"
    depends_on:
      cms-postgres:
        condition: service_healthy
    restart: unless-stopped

  cms-scheduler:
    build:
      context: ../..
      dockerfile: apps/cms/Dockerfile
    command: ["bun", "run", "cms:scheduler"]
    environment:
      <<: *cms-environment
    # Healthy while ticks succeed: the scheduler touches its heartbeat file
    # after each tick without errors, once a minute.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/cms-scheduler-heartbeat -mmin -5 | grep -q ."]
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 3
    depends_on:
      cms-postgres:
        condition: service_healthy
    restart: unless-stopped

  cms-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_CMSPOSTGRES:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hush_cms_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  hush_cms_postgres:
