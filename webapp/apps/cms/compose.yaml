# The hush CMS stack: the API, its scheduler (publishing due posts and daily
# backups) and its own PostgreSQL. Coolify deploys this file as a Docker
# Compose resource; any Docker Compose host runs it the same way. It publishes
# no host ports. compose.local.yaml adds what local development needs, and
# webapp/compose.yaml includes both. Secrets are references: their values live
# in the platform's secret store. Empty defaults keep local runs quiet; in
# production the CMS refuses to start when a bucket lacks its keys, and
# PostgreSQL refuses an empty password.
x-cms-environment: &cms-environment
  NODE_ENV: ${NODE_ENV:-production}
  CMS_DATABASE_URL: postgresql://cms:${SERVICE_PASSWORD_64_CMSPOSTGRES:-}@cms-postgres:5432/cms
  CMS_S3_BUCKET: ${CMS_S3_BUCKET:-hush-blog-media}
  CMS_S3_ENDPOINT: ${CMS_S3_ENDPOINT:-}
  CMS_S3_ACCESS_KEY_ID: ${CMS_S3_ACCESS_KEY_ID:-}
  CMS_S3_SECRET_ACCESS_KEY: ${CMS_S3_SECRET_ACCESS_KEY:-}
  CMS_BACKUP_S3_BUCKET: ${CMS_BACKUP_S3_BUCKET:-hush-cms-backups}
  CMS_BACKUP_S3_ENDPOINT: ${CMS_BACKUP_S3_ENDPOINT:-}
  CMS_BACKUP_S3_ACCESS_KEY_ID: ${CMS_BACKUP_S3_ACCESS_KEY_ID:-}
  CMS_BACKUP_S3_SECRET_ACCESS_KEY: ${CMS_BACKUP_S3_SECRET_ACCESS_KEY:-}
  CMS_BACKUP_KEEP_DAYS: ${CMS_BACKUP_KEEP_DAYS:-30}

services:
  cms:
    build:
      context: ../..
      dockerfile: apps/cms/Dockerfile
    environment:
      <<: *cms-environment
      PORT: "3100"
    expose:
      - "3100"
    depends_on:
      cms-postgres:
        condition: service_healthy
    restart: unless-stopped

  cms-scheduler:
    build:
      context: ../..
      dockerfile: apps/cms/Dockerfile
    command: ["bun", "run", "cms:scheduler"]
    environment:
      <<: *cms-environment
    depends_on:
      cms:
        condition: service_healthy
    restart: unless-stopped

  cms-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_CMSPOSTGRES:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hush_cms_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  hush_cms_postgres:
